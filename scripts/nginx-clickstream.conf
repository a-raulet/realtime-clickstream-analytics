# Nginx configuration for Clickstream Analytics
# Copy to /etc/nginx/sites-available/clickstream
# Then: ln -s /etc/nginx/sites-available/clickstream /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name YOUR_DOMAIN.com;  # Replace with your domain

    # Redirect HTTP to HTTPS (uncomment after certbot setup)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://localhost:8501;
        proxy_http_version 1.1;

        # WebSocket support (required for Streamlit)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (Streamlit needs longer timeouts)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;

        # Buffer settings
        proxy_buffering off;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 24k;
        proxy_buffers 64 4k;
    }

    # Streamlit specific endpoints
    location /_stcore/stream {
        proxy_pass http://localhost:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Health check endpoint
    location /_stcore/health {
        proxy_pass http://localhost:8501/_stcore/health;
    }

    # Optional: Spark UI (uncomment if needed)
    # location /spark/ {
    #     proxy_pass http://localhost:4040/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}

